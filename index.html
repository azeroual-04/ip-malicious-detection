<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>AI IP Shield Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; text-align: center; padding: 50px; }
        .container { background: #1e293b; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 400px; }
        input { width: 80%; padding: 12px; margin: 20px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 8px; font-weight: bold; width: 85%; }
        button:hover { background: #2563eb; }
        #loader { display: none; margin: 20px; color: #94a3b8; }
        .result-box { margin-top: 25px; padding: 15px; border-radius: 8px; display: none; background: #334155; }
        .danger { color: #ef4444; }
        .safe { color: #22c55e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ AI IP Shield</h1>
        <p>أدخل عنوان IP لتحليله عالمياً بالذكاء الاصطناعي</p>
        <input type="text" id="ipInput" placeholder="مثال: 8.8.8.8">
        <button onclick="analyzeIP()">تحليل فوراً</button>
        <div id="loader">جاري الاتصال بالمواقع العالمية...</div>
        <div id="resultBox" class="result-box">
            <div id="ipDisplay" style="font-weight: bold;"></div>
            <div id="decisionDisplay" style="font-size: 1.5em; margin: 10px 0;"></div>
            <div id="scoreDisplay"></div>
        </div>
    </div>

    <script>
        async function analyzeIP() {
            const ip = document.getElementById('ipInput').value;
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            
            if(!ip) return alert("يرجى إدخال IP");

            loader.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const response = await fetch('http://127.0.0.1:5000/predict_real', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ ip: ip })
                });
                const res = await response.json();
                
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                
                document.getElementById('ipDisplay').innerText = `الـ IP المفحوص: ${res.ip}`;
                document.getElementById('decisionDisplay').innerText = res.decision;
                document.getElementById('decisionDisplay').className = res.is_malicious ? 'danger' : 'safe';
                document.getElementById('scoreDisplay').innerText = `درجة التهديد: ${res.threat_score}`;
            } catch (error) {
                alert("خطأ في الاتصال بالسيرفر");
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
