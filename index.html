<!DOCTYPE html>
<html>
<head>
    <title>AI IP Shield</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ نظام فحص الـ IP بالذكاء الاصطناعي</h2>
        <input type="number" id="attempts" placeholder="عدد المحاولات">
        <input type="number" id="freq" placeholder="التكرار (مثلاً 5.5)">
        <select id="vpn" style="padding: 10px; margin-bottom: 10px;">
            <option value="0">بدون VPN</option>
            <option value="1">مستخدم VPN</option>
        </select>
        <input type="number" id="rank" placeholder="كود الدولة (1-10)">
        <button onclick="checkIP()">فحص الآن</button>
        <div id="result"></div>
    </div>

    <script>
        async function checkIP() {
            const data = {
                attempts: parseInt(document.getElementById('attempts').value),
                is_vpn: parseInt(document.getElementById('vpn').value),
                frequency: parseFloat(document.getElementById('freq').value),
                country_rank: parseInt(document.getElementById('rank').value)
            };

            const response = await fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await response.json();
            document.getElementById('result').innerText = `القرار: ${result.decision} (نسبة الخطر: ${result.threat_score})`;
        }
    </script>
</body>
</html>
